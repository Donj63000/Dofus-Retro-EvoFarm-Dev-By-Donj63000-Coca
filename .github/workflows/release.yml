name: Desktop Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: EvoFarm-release
          path: distribution
      - name: Verifier la version et les distributions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          test "$RELEASE_TAG" = "v$VERSION"
          python scripts/verify-release.py --distribution distribution --version "$VERSION"
      # L'attestation est publiee dans GitHub, sans ajouter un sixieme asset :
      # le contrat de verification des cinq fichiers de release reste inchange.
      - name: Attester la provenance des quatre distributions
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            distribution/EvoFarm.exe
            distribution/EvoFarm-Windows-x64.zip
            distribution/EvoFarm-Linux-x64.tar.gz
            distribution/EvoFarm-macOS-universal.zip
      - name: Publier Windows, Linux et macOS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          NOTES="docs/releases/$RELEASE_TAG.md"
          test -f "$NOTES"
          if IS_DRAFT=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$IS_DRAFT" != "true" ]; then
              echo "Cette version est deja publique ; ses fichiers sont conserves." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "EvoFarm $RELEASE_TAG - Windows, Linux et macOS" --notes-file "$NOTES"
          fi
          gh release upload "$RELEASE_TAG" distribution/EvoFarm.exe distribution/EvoFarm-Windows-x64.zip distribution/EvoFarm-Linux-x64.tar.gz distribution/EvoFarm-macOS-universal.zip distribution/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --notes-file "$NOTES" --draft=false --latest
