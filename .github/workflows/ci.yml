name: Desktop CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  native:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2022
            platform: windows
            target: x86_64-pc-windows-msvc
            targets: x86_64-pc-windows-msvc
          - name: Linux x64
            runner: ubuntu-22.04
            platform: linux
            target: x86_64-unknown-linux-gnu
            targets: x86_64-unknown-linux-gnu
          - name: macOS Apple Silicon et universel
            runner: macos-15
            platform: macos
            target: aarch64-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: macOS Intel natif
            runner: macos-15-intel
            platform: macos-intel
            target: x86_64-apple-darwin
            targets: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy
          targets: ${{ matrix.targets }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
      - name: Bibliotheques Linux et bureau de test
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libxkbcommon-x11-0 libgl1-mesa-dev libegl1-mesa-dev libwayland-dev xvfb xauth libgl1-mesa-dri dbus-x11 xdg-desktop-portal xdg-desktop-portal-gtk desktop-file-utils
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - name: Tests Rust natifs
        run: cargo test --all-targets --locked --target ${{ matrix.target }}
      - name: Tests des archives et de la publication
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Tests du packaging Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/test-packaging.ps1
      - name: Installer cargo-audit
        if: matrix.platform == 'windows'
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Audit des dependances de toutes les cibles
        if: matrix.platform == 'windows'
        shell: bash
        run: cargo audit --json > cargo-audit.json
      - name: Conserver les constats de dependances
        if: always() && matrix.platform == 'windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: security-audit-windows
          if-no-files-found: warn
          retention-days: 30
          path: |
            cargo-audit.json
            Cargo.lock
      - name: Construire Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/build-release.ps1
      - name: Verifier le lancement Windows depuis l'archive
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          GALLIUM_DRIVER: llvmpipe
        run: |
          # Je fournis OpenGL au runner sans GPU, uniquement dans son dossier de test.
          $smokeDir = Join-Path $env:RUNNER_TEMP "evofarm-smoke"
          $mesaArchive = Join-Path $env:RUNNER_TEMP "mesa3d-26.2.0-release-msvc.7z"
          Invoke-WebRequest -Uri "https://github.com/pal1000/mesa-dist-win/releases/download/26.2.0/mesa3d-26.2.0-release-msvc.7z" -OutFile $mesaArchive
          if ((Get-FileHash -LiteralPath $mesaArchive -Algorithm SHA256).Hash -ne "dcb2719ef346dab5b609fcb193a5f13cfc4b0502e3f4de1ad43d349477402f47") {
            throw "L'empreinte de Mesa ne correspond pas a la version de test attendue."
          }
          Expand-Archive -LiteralPath EvoFarm-Windows-x64.zip -DestinationPath $smokeDir
          & 7z.exe e $mesaArchive "x64/opengl32.dll" "x64/libgallium_wgl.dll" "-o$smokeDir" -y
          if ($LASTEXITCODE -ne 0) { throw "L'extraction du rendu logiciel a echoue." }
          foreach ($library in @("opengl32.dll", "libgallium_wgl.dll")) {
            if (-not (Test-Path -LiteralPath (Join-Path $smokeDir $library) -PathType Leaf)) {
              throw "Bibliotheque de rendu logiciel absente : $library"
            }
          }
          python scripts/smoke-app.py --binary (Join-Path $smokeDir "EvoFarm.exe")
      - name: Construire Linux
        if: matrix.platform == 'linux'
        run: python scripts/build-unix-release.py --platform linux
      - name: Verifier le lancement Linux depuis l'archive
        if: matrix.platform == 'linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          tar -xzf dist/EvoFarm-Linux-x64.tar.gz -C "$RUNNER_TEMP"
          desktop-file-validate "$RUNNER_TEMP/EvoFarm/fr.donj63000.evofarm.desktop"
          dbus-run-session -- xvfb-run -a python scripts/smoke-app.py --binary "$RUNNER_TEMP/EvoFarm/evofarm"
      - name: Construire macOS universel
        if: matrix.platform == 'macos'
        run: python scripts/build-unix-release.py --platform macos
      - name: Verifier le lancement du bundle macOS universel
        if: matrix.platform == 'macos'
        run: |
          ditto -x -k dist/EvoFarm-macOS-universal.zip "$RUNNER_TEMP/evofarm-smoke"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/evofarm-smoke/EvoFarm.app"
          python scripts/smoke-app.py --binary "$RUNNER_TEMP/evofarm-smoke/EvoFarm.app/Contents/MacOS/evofarm" --check-macos
      - name: Construire et lancer macOS Intel nativement
        if: matrix.platform == 'macos-intel'
        run: |
          cargo build --release --locked --target x86_64-apple-darwin
          python scripts/smoke-app.py --binary target/x86_64-apple-darwin/release/evofarm --check-macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'windows'
        with:
          name: EvoFarm-Windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            EvoFarm.exe
            EvoFarm-Windows-x64.zip
            SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'linux'
        with:
          name: EvoFarm-Linux-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/EvoFarm-Linux-x64.tar.gz
            dist/SHA256SUMS-linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.platform == 'macos'
        with:
          name: EvoFarm-macOS-universal
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/EvoFarm-macOS-universal.zip
            dist/SHA256SUMS-macos

  distribution:
    name: Verifier les trois distributions
    needs: native
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: EvoFarm-*
          merge-multiple: true
          path: distribution
      - name: Verifier les archives et reunir les empreintes
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          python scripts/verify-release.py --distribution distribution --version "$VERSION" --assemble
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EvoFarm-release
          if-no-files-found: error
          retention-days: 14
          path: |
            distribution/EvoFarm.exe
            distribution/EvoFarm-Windows-x64.zip
            distribution/EvoFarm-Linux-x64.tar.gz
            distribution/EvoFarm-macOS-universal.zip
            distribution/SHA256SUMS
