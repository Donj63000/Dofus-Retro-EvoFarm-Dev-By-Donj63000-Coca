name: Windows CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.93.0"
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: false
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
      - name: Tests Rust
        run: cargo test --all-targets --locked --target x86_64-pc-windows-msvc
      - name: Tests du packaging
        shell: pwsh
        run: ./scripts/test-packaging.ps1
      - name: Installer cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked
      - name: Audit des dependances
        run: cargo audit
      - name: Construire la distribution Windows x64
        shell: pwsh
        run: ./scripts/build-release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: EvoFarm-Windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            EvoFarm.exe
            EvoFarm-Windows-x64.zip
            SHA256SUMS
