name: ci

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Dependency audit
        run: cargo audit

      - name: Compute SHA-256
        shell: pwsh
        run: |
          $exe = "target\release\evofarm.exe"
          if (-not (Test-Path $exe)) { throw "Executable introuvable: $exe" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "target\release\evofarm.exe.sha256" -Value "$hash  evofarm.exe" -Encoding Ascii -NoNewline

      - uses: actions/upload-artifact@v4
        with:
          name: evofarm-windows
          path: |
            target/release/evofarm.exe
            target/release/evofarm.exe.sha256
