[package]
name = "dofus_rentabilite"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[package.metadata.winres]
ProductName = "EvoFarm"
FileDescription = "EvoFarm"
OriginalFilename = "EvoFarm.exe"

[dependencies]
eframe = "0.27"
egui = "0.27"
egui_plot = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.14"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
